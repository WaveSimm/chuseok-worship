<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>2026 추석 가정예배</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;--fg:#111111;--muted:#5c5c5c;--line:#dcdcdc;
  --link:#1a47b8;--btn:#111111;--btn-fg:#ffffff;--btn2:#f1f1f1;--btn2-fg:#111111;
  --night:#132039;--night-fg:#f4f1e6;--night-muted:#b7bccb;--moon:#f3d67c;--moon-fg:#1b1a12;
  --pad:40px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#000000;--fg:#ffffff;--muted:#c2c2c2;--line:#3a3a3a;--link:#9cc1ff;--btn:#ffffff;--btn-fg:#000000;--btn2:#1e1e1e;--btn2-fg:#ffffff;}
}
:root[data-theme="dark"]{--bg:#000000;--fg:#ffffff;--muted:#c2c2c2;--line:#3a3a3a;--link:#9cc1ff;--btn:#ffffff;--btn-fg:#000000;--btn2:#1e1e1e;--btn2-fg:#ffffff;}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5;word-break:keep-all;-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
button{font-family:inherit;cursor:pointer}
a{color:var(--link)}
:focus-visible{outline:4px solid var(--link);outline-offset:3px}
.hidden{display:none!important}

/* 홈 */
.home{position:fixed;inset:0;overflow:auto;background:var(--night);color:var(--night-fg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(env(safe-area-inset-top,0px) + 32px) 24px calc(env(safe-area-inset-bottom,0px) + 32px)}
.moon{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 38% 35%,#fff6c8 0%,var(--moon) 55%,#d9b95a 100%);box-shadow:0 0 60px 10px rgba(243,214,124,.28);margin-bottom:34px}
.home h1{font-size:30px;font-weight:900;margin:0 0 8px;line-height:1.25}
.home .theme{font-size:18px;color:var(--night-muted);margin:0 0 40px}
.home a.enter{display:block;width:min(100%,420px);text-decoration:none;border-radius:18px;padding:22px 20px;margin:0 0 14px;font-weight:700;line-height:1.3}
.enter.mom{background:var(--moon);color:var(--moon-fg);font-size:26px}
.enter.mom small{display:block;font-size:17px;font-weight:500;margin-top:4px}
.enter.fam{border:2px solid var(--night-muted);color:var(--night-fg);font-size:22px}
.home .note{margin-top:28px;font-size:14px;color:var(--night-muted)}

/* 어머니용 (패드) */
.pad{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.pad-top{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 8px;border-bottom:2px solid var(--line)}
.pad-top .count{flex:1;text-align:center;color:var(--muted);font-weight:500;font-size:22px}
.tb{min-width:56px;min-height:52px;padding:0 14px;border:2px solid var(--line);border-radius:12px;background:var(--btn2);color:var(--btn2-fg);font-size:20px;font-weight:700}
.tb:disabled{opacity:.3}
.pad-body{flex:1;overflow:auto;padding:28px 30px 40px;font-size:var(--pad)}
.pad-bottom{display:flex;gap:12px;padding:12px 14px calc(env(safe-area-inset-bottom,0px) + 12px);border-top:2px solid var(--line)}
.pad-bottom button{flex:1;min-height:96px;font-size:34px;font-weight:900;border:0;border-radius:18px;background:var(--btn);color:var(--btn-fg)}
.pad-bottom button.prev{flex:.6;background:var(--btn2);color:var(--btn2-fg);border:2px solid var(--line)}
.pad-bottom button:disabled{opacity:.25}

/* 공통 내용 (글자 크기는 부모의 em을 따름) */
.who{font-size:.55em;color:var(--muted);font-weight:500;margin:0 0 .2em}
.pad h2{font-weight:900;line-height:1.25;margin:0 0 .6em;font-size:1.15em}
.verse{display:grid;grid-template-columns:auto 1fr;column-gap:.45em;margin:0 0 .55em;line-height:1.5}
.verse .vn{font-weight:900;color:var(--muted)}
.verse .side{display:block;font-size:.5em;font-weight:700;color:var(--muted);line-height:1.3;margin:.2em 0 .1em}
.hymn-no{font-size:2.6em;font-weight:900;line-height:1;margin:0 0 .12em}
.hymn-title{font-size:1.3em;font-weight:900;line-height:1.2;margin:0 0 .25em}
.hymn-v{font-size:.7em;color:var(--muted);margin:0 0 .6em}
a.bigbtn{display:block;text-decoration:none;text-align:center;background:var(--btn);color:var(--btn-fg);border-radius:.35em;padding:.45em .6em;margin:0 0 .35em;font-size:.72em;font-weight:700;line-height:1.3}
/* ===== 비밀번호 잠금 ===== */
#gate{position:fixed;inset:0;z-index:999;background:var(--night);color:var(--night-fg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.1rem;padding:1.5rem;
  font-size:clamp(18px,4.5vw,26px);text-align:center}
#gate.hidden{display:none}
#gate h2{margin:0;font-size:1.25em;font-weight:900;letter-spacing:-.02em}
#gate p{margin:0;font-size:.72em;color:var(--night-muted);line-height:1.5}
#gate input{width:min(88vw,420px);font-size:1.05em;font-family:inherit;text-align:center;
  padding:.55em .6em;border-radius:.4em;border:2px solid #40506f;background:#0d1729;color:var(--night-fg)}
#gate input:focus{outline:none;border-color:var(--moon)}
#gate button{width:min(88vw,420px);font-size:1.05em;font-family:inherit;font-weight:700;
  padding:.55em .6em;border-radius:.4em;border:0;background:var(--moon);color:var(--moon-fg)}
#gateErr{min-height:1.2em;font-size:.7em;color:#ff9b9b}
.lin{margin:0 0 .7em}
.lin-row{display:flex;align-items:baseline;gap:.4em;margin:0 0 .45em;line-height:1.4;
  padding:0 0 .35em;border-bottom:1px solid var(--line)}
.lin-row:last-child{border-bottom:0}
.lin-g{flex:0 0 auto;font-size:.55em;color:var(--muted);letter-spacing:.02em}
.lin-n{flex:1 1 auto;font-weight:700}
.lin-f{display:block}
.lin-f + .lin-f{margin-top:.18em}
.lin-b{flex:0 0 auto;font-size:.55em;color:var(--muted);white-space:nowrap}
img.sheet{display:block;width:100%;height:auto;margin:.45em 0 .5em;
  background:#fff;border-radius:.2em;padding:.15em}
.lyric{white-space:pre-line}
.big{font-size:1.15em;font-weight:700;line-height:1.35;margin:0 0 .5em}
.sub{font-size:.7em;color:var(--muted);margin:0 0 .4em}
.lp{margin:0 0 .3em;line-height:1.45}

/* 가족용 (폰) */
.phone{max-width:620px;margin:0 auto;padding:24px 18px 80px;font-size:17px}
.phone .back{font-size:15px;text-decoration:none}
.phone header{padding:14px 0 18px}
.phone header .k{font-size:14px;color:var(--muted)}
.phone header h1{font-size:26px;font-weight:900;margin:2px 0 4px;line-height:1.25}
.phone header .theme{margin:0;font-size:17px}
.roles{border:2px solid var(--line);border-radius:14px;padding:10px 16px;margin:14px 0 8px;font-size:15px}
.roles div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.roles div:last-child{border:0}
.roles span:first-child{color:var(--muted)}
.step{border-top:2px solid var(--line);padding:20px 0 14px}
.step .num{font-size:14px;color:var(--muted);font-weight:700}
.step h3{font-size:22px;font-weight:900;line-height:1.25;margin:2px 0 4px}
.step .w{font-size:15px;color:var(--muted);margin:0 0 12px}
.step .hymn-no{font-size:44px}
.step .hymn-title{font-size:22px}
.step .hymn-v{font-size:15px}
.step a.bigbtn{font-size:17px;padding:13px 14px;margin-bottom:8px}
.step .big{font-size:19px}
.step .sub{font-size:15px}
.phone .foot{margin-top:28px;font-size:14px;color:var(--muted)}
</style>
</head>
<body>

<div id="gate">
  <h2>2026 추석 가정예배</h2>
  <p>가족용 페이지입니다.<br>비밀번호를 한 번만 넣으면 이 기기에서는 다시 묻지 않습니다.</p>
  <input id="gatePw" type="password" inputmode="text" autocomplete="off" placeholder="비밀번호">
  <button id="gateBtn">들어가기</button>
  <div id="gateErr"></div>
</div>

<div id="home" class="home hidden">
  <div class="moon" aria-hidden="true"></div>
  <h1>2026 추석 가정예배</h1>
  <p class="theme" id="homeTheme"></p>
  <a class="enter mom" href="#pad">어머니용<small>패드 · 큰 글씨</small></a>
  <a class="enter fam" href="#phone">가족용 (폰)</a>
  <p class="note">약 25~30분</p>
</div>

<div id="pad" class="pad hidden">
  <div class="pad-top">
    <button class="tb" onclick="location.hash=''" aria-label="홈으로">홈</button>
    <span class="count" id="padCount"></span>
    <button class="tb" id="fontDown" onclick="fontStep(-1)" aria-label="글자 작게">가−</button>
    <button class="tb" id="fontUp" onclick="fontStep(1)" aria-label="글자 크게">가＋</button>
    <button class="tb" id="themeBtn" onclick="toggleTheme()"></button>
  </div>
  <div class="pad-body" id="padBody"></div>
  <div class="pad-bottom">
    <button class="prev" id="prevBtn" onclick="go(-1)">이전</button>
    <button id="nextBtn" onclick="go(1)">다음</button>
  </div>
</div>

<div id="phone" class="hidden"><div class="phone" id="phoneBody"></div></div>

<script>
/* ===== 내용 ===== */

/* img: sheets/ 폴더에 악보 이미지를 넣으면 화면에 바로 뜬다.
   파일이 없으면 그 자리는 조용히 사라지고 아래 링크만 남는다. */

/* ===== 그리기 도우미 ===== */
function verses(list, side){
  return list.map(([n,t]) => {
    const s = side ? `<span class="side">${side(n)}</span>` : '';
    return `<div class="verse"><span class="vn">${n}</span><span>${s}${t}</span></div>`;
  }).join('');
}
const altSide = n => (n % 2 ? '어른 세대' : '자녀 세대');

function hymn(h){
  const ly = (LYRICS[h.no] || []).map((t,i) =>
    `<div class="verse"><span class="vn">${i+1}</span><span class="lyric">${t}</span></div>`).join('');
  return `<div class="hymn-no">${h.no}장</div>
    <div class="hymn-title">${h.title}</div>
    <p class="hymn-v">${h.verses}</p>${ly}
    ${h.img ? `<img class="sheet" src="${h.img}" alt="${h.no}장 악보" onerror="this.remove()">` : ''}
    <a class="bigbtn" target="_blank" rel="noopener" href="${h.video}">반주 영상 (유튜브)</a>`;
}
const points = () => POINTS.map(([k,t]) => `<div class="verse"><span class="vn">${k}</span><span>${t}</span></div>`).join('');
const lineage = () => `<div class="lin">` + LINEAGE.map(([gen, groups, bible]) =>
  `<div class="lin-row"><span class="lin-g">${gen}</span><span class="lin-n">` +
  groups.map(g => `<span class="lin-f">${g.join(' · ')}</span>`).join('') +
  `</span>` + (bible ? `<span class="lin-b">${bible}</span>` : '') +
  `</div>`).join('') + `</div>`;
const prayer = () => LORDS_PRAYER.map(l => `<p class="lp">${l}</p>`).join('');
const creed = (list = CREED) => list.map(l => `<p class="lp">${l}</p>`).join('');

/* 순서 (폰용 한 화면 + 패드용 여러 화면) */
const STEPS = [
  { t:'사도신경', w:'다 같이', body: creed(),
    pad: [{ h:'사도신경', w:'다 같이', b: creed() }]},
  { t:'찬송 587장 감사하는 성도여', w:'다 같이', body: hymn(HYMNS[587]),
    pad: [{ h:'찬송', w:'다 같이', b: hymn(HYMNS[587]) }] },
  { t:'시편 100편 교독', w:'다 같이 · 홀수 절은 어른 세대, 짝수 절은 자녀 세대',
    body: verses(PS100, altSide),
    pad: [{ h:'시편 100편 교독', w:'홀수 절 어른 세대 · 짝수 절 자녀 세대', b: verses(PS100, altSide) }]},
  { t:'기도', w:'송희원', body:'<p class="big">송희원</p>',
    pad: [{ h:'기도', w:'', b:'<p class="big">송희원</p>' }] },
  { t:'성경 봉독 디모데후서 1장 3~7절', w:'다 같이',
    body: verses(TIM),
    pad: [{ h:'디모데후서 1장 3~7절', w:'다 같이', b: verses(TIM) }]},
  { t:'말씀 나눔', w:'심윤송 · 5분', body: lineage() + points(),
    pad: [{ h:'대를 이어 흐르는 믿음', w:'심윤송', b: lineage() + points() }]},
  { t:'기도', w:'사회자', body:'<p class="big">심윤송</p>',
    pad: [{ h:'기도', w:'', b:'<p class="big">심윤송</p>' }] },
  { t:'찬송 305장 나 같은 죄인 살리신', w:'다 같이', body: hymn(HYMNS[305]),
    pad: [{ h:'찬송', w:'다 같이', b: hymn(HYMNS[305]) }] },
  { t:'어머니 기도', w:'어머니',
    body:'<p class="big">어머니께서 자녀와 손주들을 위해 기도해 주십니다</p><p class="sub">힘드시면 자녀들이 대신합니다</p>',
    pad: [{ h:'어머니 기도', w:'', b:'<p class="big">자녀와 손주들을 위해 어머니께서 기도해 주세요</p>' }] },
  { t:'주기도문', w:'다 같이', body: prayer(),
    pad: [{ h:'주기도문', w:'다 같이', b: prayer() }] },
];

const SCREENS = [
  { h:'2026 추석 가정예배', w:'', b:`<p class="big">${THEME}</p><p class="sub">본문 디모데후서 1장 3절부터 7절</p><p class="sub">오른쪽 아래 ‘다음’을 누르세요</p>` },
  ...STEPS.flatMap(s => s.pad),
];

/* ===== 설정 저장 (없어도 동작) ===== */
const SIZES = [34, 40, 48, 58, 70, 84];
function loadPref(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : v; } catch(e){ return d; } }
function savePref(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
let fi = Math.min(SIZES.length-1, Math.max(0, parseInt(loadPref('gw-font', 1)) || 1));
function applyFont(){
  document.documentElement.style.setProperty('--pad', SIZES[fi] + 'px');
  const sm = document.getElementById('fontDown'), bg = document.getElementById('fontUp');
  if (sm) sm.disabled = fi === 0;
  if (bg) bg.disabled = fi === SIZES.length - 1;
}
function fontStep(d){ fi = Math.min(SIZES.length-1, Math.max(0, fi + d)); savePref('gw-font', fi); applyFont(); }
const savedTheme = loadPref('gw-theme', '');
if (savedTheme) document.documentElement.dataset.theme = savedTheme;
function effDark(){
  const t = document.documentElement.dataset.theme;
  if (t) return t === 'dark';
  return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
}
function toggleTheme(){
  const next = effDark() ? 'light' : 'dark';
  document.documentElement.dataset.theme = next; savePref('gw-theme', next); themeLabel();
}
function themeLabel(){ const b = document.getElementById('themeBtn'); if (b) b.textContent = effDark() ? '밝게' : '어둡게'; }

/* ===== 화면 ===== */
let cur = 0;
const $ = s => document.querySelector(s);
function show(id){ ['home','pad','phone'].forEach(v => $('#'+v).classList.toggle('hidden', v !== id)); }

function showPad(i){
  cur = Math.max(0, Math.min(SCREENS.length-1, i));
  const s = SCREENS[cur];
  show('pad'); applyFont(); themeLabel();
  $('#padBody').innerHTML = (s.w ? `<p class="who">${s.w}</p>` : '') + `<h2>${s.h}</h2>` + s.b;
  $('#padBody').scrollTop = 0;
  /* 타이틀(0번) 다음부터는 장면 번호가 곧 순서 번호 */
  $('#padCount').textContent = cur === 0 ? '시작' : `순서 ${cur} / ${SCREENS.length-1}`;
  $('#prevBtn').disabled = cur === 0;
  $('#nextBtn').disabled = cur === SCREENS.length-1;
  $('#nextBtn').textContent = cur === SCREENS.length-1 ? '끝' : '다음';
}
function go(d){ location.hash = 'pad/' + (cur + d); }

function showPhone(){
  show('phone');
  const roles = ROLES.map(([a,b]) => `<div><span>${a}</span><span>${b}</span></div>`).join('');
  const steps = STEPS.map((s,i) =>
    `<section class="step"><div class="num">${i+1}</div><h3>${s.t}</h3><p class="w">${s.w}</p><div class="body">${s.body}</div></section>`).join('');
  $('#phoneBody').innerHTML = `
    <a class="back" href="#">홈으로</a>
    <header><div class="k">2026 추석</div><h1>가정예배</h1><p class="theme">${THEME}</p></header>
    <div class="roles">${roles}</div>
    ${steps}
    <p class="foot">본문 디모데후서 1장 3~7절 · 약 25~30분</p>`;
  window.scrollTo(0,0);
}

function showHome(){ show('home'); $('#homeTheme').textContent = THEME; }

function route(){
  const h = location.hash.replace('#','');
  const [v, idx] = h.split('/');
  if (v === 'pad') showPad(parseInt(idx) || 0);
  else if (v === 'phone') showPhone();
  else showHome();
}
window.addEventListener('hashchange', route);

/* ===== 비밀번호 잠금 =====
   아래 PASS_HASH는 build.py가 .env의 WORSHIP_PASSWORD로부터 자동으로 채웁니다.
   직접 고치지 마세요. 비밀번호를 바꾸려면:
     1) .env 의 WORSHIP_PASSWORD 수정
     2) python build.py
     3) git commit && git push                                    */
const PASS_HASH = '158a323a7ba44870f23d96f1516dd70aa48e9a72db4ebb026b0a89e212a208ab';
const GATE_KEY = 'worship2026.unlocked';

const gate = document.getElementById('gate');
const gatePw = document.getElementById('gatePw');
const gateErr = document.getElementById('gateErr');

async function sha256hex(s){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
}
function unlock(){
  gate.classList.add('hidden');
  try { localStorage.setItem(GATE_KEY, PASS_HASH); } catch(e){}
  route();
}
async function trySubmit(){
  gateErr.textContent = '';
  let h = '';
  try { h = await sha256hex(gatePw.value.trim()); } catch(e){ h = ''; }
  if (h === PASS_HASH) unlock();
  else { gateErr.textContent = '비밀번호가 맞지 않습니다'; gatePw.value = ''; gatePw.focus(); }
}
document.getElementById('gateBtn').addEventListener('click', trySubmit);
gatePw.addEventListener('keydown', e => { if (e.key === 'Enter') trySubmit(); });

/* 이미 이 기기에서 푼 적 있으면 바로 통과 */
let remembered = null;
try { remembered = localStorage.getItem(GATE_KEY); } catch(e){}
if (remembered === PASS_HASH) {
  gate.classList.add('hidden');
  route();
} else if (!(window.crypto && crypto.subtle)) {
  /* 구형 브라우저 등으로 해시를 못 쓰면 막지 않고 통과 */
  gate.classList.add('hidden');
  route();
} else {
  gatePw.focus();
}
</script>
</body>
</html>
